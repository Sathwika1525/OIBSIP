<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍕 HotPizza - Siddipet Super Fast Delivery</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #ff6b35, #f7931e, #667eea);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        /* Glass Effect */
        .glass { 
            background: rgba(255,255,255,0.15); 
            backdrop-filter: blur(20px); 
            border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        /* Header */
        header { 
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(20px);
            padding: 1rem 2rem; 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 1000;
            animation: slideDown 0.8s ease;
        }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .logo { 
            font-size: 2rem; 
            font-weight: 700; 
            background: linear-gradient(45deg, #fff, #ff6b35); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-links a, .nav-links button { 
            color: white; 
            text-decoration: none; 
            padding: 0.8rem 1.5rem; 
            border-radius: 25px; 
            font-weight: 500; 
            transition: all 0.3s; 
            border: none; 
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            position: relative;
        }
        .nav-links a:hover, .nav-links button:hover { 
            background: #ff6b35; 
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,107,53,0.4);
        }

        /* Sections */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        section { padding: 120px 0 4rem; min-height: 100vh; display: none; }
        section.active { display: block; animation: fadeInUp 1s ease; }
        #menu.active { display: block; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        /* Hero */
        .hero { text-align: center; color: white; padding-bottom: 3rem; }
        .hero h1 { font-size: 4rem; margin-bottom: 1rem; animation: bounceIn 1.5s ease; }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 50% { transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
        .hero p { font-size: 1.3rem; margin-bottom: 2rem; opacity: 0.9; }

        /* Menu Grid */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.5rem; }
        .pizza-card { 
            background: rgba(255,255,255,0.95); 
            border-radius: 25px; 
            overflow: hidden; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pizza-card:hover { 
            transform: translateY(-20px) scale(1.02); 
            box-shadow: 0 30px 80px rgba(255,107,53,0.4);
        }
        .pizza-img { width: 100%; height: 220px; object-fit: cover; transition: transform 0.4s; }
        .pizza-card:hover .pizza-img { transform: scale(1.1); }
        .pizza-info { padding: 2rem; }
        .pizza-name { font-size: 1.8rem; margin-bottom: 0.8rem; color: #ff6b35; }
        .pizza-price { font-size: 2rem; font-weight: 700; color: #333; margin-bottom: 1.5rem; }
        .customize select { 
            width: 100%; 
            padding: 0.8rem; 
            border: 2px solid #eee; 
            border-radius: 12px; 
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .add-cart { 
            width: 100%; 
            background: linear-gradient(45deg, #ff6b35, #f7931e); 
            color: white; 
            border: none; 
            padding: 1.2rem; 
            border-radius: 15px; 
            font-size: 1.2rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .add-cart:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(255,107,53,0.4); }

        /* Cart */
        .cart-section { 
            background: rgba(255,255,255,0.95); 
            margin: 2rem auto; 
            padding: 3rem; 
            border-radius: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); 
            max-width: 800px;
            display: none;
        }
        .cart-section.active { display: block; animation: slideInRight 0.6s ease; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1.5rem; 
            background: #f8f9fa; 
            border-radius: 15px; 
            margin-bottom: 1rem;
        }
        .cart-total { font-size: 2rem; font-weight: 700; text-align: right; margin: 2rem 0; color: #ff6b35; }
        .order-btn { width: 100%; background: linear-gradient(45deg, #ff6b35, #f7931e); color: white; border: none; padding: 1.5rem; border-radius: 15px; font-size: 1.3rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .order-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(255,107,53,0.4); }

        /* Orders */
        .orders-section { 
            background: rgba(255,255,255,0.95); 
            margin: 2rem auto; 
            padding: 3rem; 
            border-radius: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.2); 
            max-width: 800px;
        }
        .order-item { 
            background: #f8f9fa; 
            padding: 2rem; 
            border-radius: 15px; 
            margin-bottom: 1.5rem;
        }
        .status-badge { 
            padding: 0.6rem 1.5rem; 
            border-radius: 25px; 
            font-weight: 600; 
            font-size: 0.9rem;
        }
        .status-received { background: #28a745; color: white; }
        .status-preparing { background: #ffc107; color: black; }
        .status-ready { background: #007bff; color: white; }

        /* Login Modal */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.7); 
            z-index: 2000;
            backdrop-filter: blur(10px);
        }
        .modal-content { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 90%; 
            max-width: 450px; 
            padding: 3rem; 
            animation: modalPop 0.4s ease;
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
        }
        @keyframes modalPop { from { opacity: 0; transform: translate(-50%, -60%) scale(0.7); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

        .form-group { margin-bottom: 1.5rem; }
        .form-group input { width: 100%; padding: 1.2rem; border: 2px solid #eee; border-radius: 15px; font-size: 1.1rem; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .menu-grid { grid-template-columns: 1fr; }
            nav { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>🔐 Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="order-btn">Login 🚀</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                👤 User: <strong>user</strong> / <strong>123</strong><br>
                ⚙️ Admin: <strong>admin</strong> / <strong>admin123</strong>
            </p>
        </div>
    </div>

    <header>
        <nav>
            <div class="logo">🍕 HotPizza</div>
            <div class="nav-links">
                <a href="#" onclick="showMenu()">🍕 Menu</a>
                <button class="cart-btn" onclick="toggleCart()">
                    🛒 Cart (<span id="cart-count">0</span>)
                </button>
                <a href="#" onclick="showOrders()">📦 Orders</a>
                <button onclick="showLogin()">🔐 Login</button>
            </div>
        </nav>
    </header>
    
    <!-- Menu Section -->
    <section id="menu" class="active">
        <div class="hero container">
            <h1>Hot Pizza Delivered Fast!</h1>
            <p>Order your favorite pizza in under 30 minutes. Customize & track live.</p>
        </div>
        
        <div class="container">
            <div class="menu-grid" id="pizza-menu"></div>
        </div>
    </section>
    
    <!-- Cart Section -->
    <section id="cart-section">
        <div class="cart-section" id="cart-container">
            <h2>🛒 Your Cart</h2>
            <div id="cart-items"></div>
            <div class="cart-total" id="cart-total">Total: ₹0</div>
            <button class="order-btn" onclick="checkoutWithRazorpay()">💳 Pay Now - Razorpay</button>
        </div>
    </section>
    
    <!-- Orders Section -->
    <section id="orders-section">
        <div class="container">
            <div class="orders-section">
                <h2>📦 My Orders</h2>
                <div id="order-list">Please login to see your orders!</div>
            </div>
        </div>
    </section>

    <script>
        // App State
        let currentUser = null;
        let isAdmin = false;
        let cart = [];
        let orders = [];

        // Pizza data
        const pizzas = [
            { id: 1, name: '🍕 Margherita', price: 299, img: 'https://cookingitalians.com/wp-content/uploads/2024/11/Margherita-Pizza.jpg' },
            { id: 2, name: '🍖 Pepperoni', price: 349, img: 'https://wallpapercave.com/wp/wp9953987.jpg' },
            { id: 3, name: '🥦 Veggie Supreme', price: 399, img: 'https://vegannook.com/sites/default/files/recipe_images/veggie_supreme.jpg' },
            { id: 4, name: '🥩 Meat Lovers', price: 449, img: 'https://www.thespruceeats.com/thmb/P35kji9UfT9JndhurFbPRb1Tuyw=/2998x1999/filters:fill(auto,1)/aqIMG_4568fhor-0b89dc5c8c494ee9828ed29805791c5a.jpg' },
            { id: 5, name: '🔥 Paneer Tikka', price: 429, img: 'https://img.freepik.com/premium-photo/paneer-tikka-image-black-background_893610-39891.jpg?w=2000' }
        ];

        // Initialize
        window.onload = function() {
            loadData();
            renderMenu();
            updateCartCount();
        };

        // Navigation Functions - FIXED!
        function showMenu() {
            document.getElementById('menu').classList.add('active');
            document.getElementById('cart-section').classList.remove('active');
            document.getElementById('orders-section').classList.remove('active');
        }

        function toggleCart() {
            if (!currentUser) {
                showLogin();
                return;
            }
            document.getElementById('menu').classList.remove('active');
            document.getElementById('orders-section').classList.remove('active');
            document.getElementById('cart-section').classList.add('active');
            document.getElementById('cart-container').classList.add('active');
            updateCartDisplay();
        }

        function showOrders() {
            if (!currentUser) {
                showLogin();
                return;
            }
            document.getElementById('menu').classList.remove('active');
            document.getElementById('cart-section').classList.remove('active');
            document.getElementById('orders-section').classList.add('active');
            renderOrders();
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === 'user' && password === '123') {
                currentUser = 'user';
                isAdmin = false;
            } else if (username === 'admin' && password === 'admin123') {
                currentUser = 'admin';
                isAdmin = true;
            } else {
                alert('❌ Wrong credentials!');
                return;
            }
            
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('loginForm').reset();
            saveData();
            alert('✅ Login successful! ' + (isAdmin ? '👑 Admin Mode' : '👤 User Mode'));
        });

        function showLogin() {
            document.getElementById('loginModal').style.display = 'block';
        }

        // Menu Functions
        function renderMenu() {
            const menu = document.getElementById('pizza-menu');
            menu.innerHTML = pizzas.map(pizza => `
                <div class="pizza-card">
                    <img src="${pizza.img}" alt="${pizza.name}" class="pizza-img">
                    <div class="pizza-info">
                        <h3 class="pizza-name">${pizza.name}</h3>
                        <div class="pizza-price">₹${pizza.price}</div>
                        <div class="customize">
                            <select class="size-select" data-id="${pizza.id}">
                                <option value="small">Small (₹${pizza.price})</option>
                                <option value="medium">Medium (₹${pizza.price + 50})</option>
                                <option value="large">Large (₹${pizza.price + 100})</option>
                            </select>
                        </div>
                        <button class="add-cart" data-id="${pizza.id}">Add to Cart 🛒</button>
                    </div>
                </div>
            `).join('');

            // Add event listeners to buttons
            document.querySelectorAll('.add-cart').forEach(btn => {
                btn.onclick = function() {
                    addToCart(this.dataset.id);
                };
            });
        }

        function addToCart(pizzaId) {
            if (!currentUser) {
                showLogin();
                return;
            }
            
            const pizza = pizzas.find(p => p.id == pizzaId);
            const sizeSelect = document.querySelector(`.size-select[data-id="${pizzaId}"]`);
            const size = sizeSelect.value;
            const price = pizza.price + (size === 'medium' ? 50 : size === 'large' ? 100 : 0);
            
            cart.push({ 
                id: Date.now() + Math.random(),
                ...pizza, 
                size, 
                price 
            });
            
            saveData();
            updateCartCount();
            alert(`✅ ${pizza.name} (${size.toUpperCase()}) added to cart!`);
        }

        // Cart Functions
        function updateCartCount() {
            document.getElementById('cart-count').textContent = cart.length;
        }

        function updateCartDisplay() {
            const cartItems = document.getElementById('cart-items');
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #666; font-size: 1.2rem; padding: 2rem;">Your cart is empty 😢<br><br><a href="#" onclick="showMenu()" style="color: #ff6b35;">← Continue Shopping</a></p>';
            } else {
                cartItems.innerHTML = cart.map((item, index) => `
                    <div class="cart-item">
                        <div>
                            <h4>${item.name}</h4>
                            <p style="color: #666;">${item.size.toUpperCase()} Size</p>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 1.5rem; font-weight: bold;">₹${item.price}</div>
                            <button onclick="removeFromCart(${index})" style="background: #dc3545; color: white; border: none; padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; margin-top: 0.5rem;">Remove ❌</button>
                        </div>
                    </div>
                `).join('');
            }
            
            document.getElementById('cart-total').textContent = `Total: ₹${total}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveData();
            updateCartCount();
            updateCartDisplay();
        }

        // Razorpay Payment - FIXED!
        function checkoutWithRazorpay() {
            if (!currentUser) {
                showLogin();
                return;
            }
            if (cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            
            const options = {
                key: "rzp_test_1DPcnrGCNtr9sU",
                amount: total * 100,
                currency: "INR",
                name: "HotPizza Siddipet",
                description: `Order by ${currentUser}`,
                handler: function(response) {
                    confirmOrder(response.razorpay_payment_id);
                },
                prefill: {
                    name: currentUser,
                    contact: "9999999999"
                },
                theme: { color: "#ff6b35" }
            };
            
            const rzp = new Razorpay(options);
            rzp.open();
        }

        function confirmOrder(paymentId) {
            const order = {
                id: Date.now(),
                items: [...cart],
                total: cart.reduce((sum, item) => sum + item.price, 0),
                paymentId: paymentId,
                status: 'received',
                timestamp: new Date().toLocaleString(),
                user: currentUser
            };
            
            orders.unshift(order);
            cart = [];
            
            saveData();
            updateCartCount();
            updateCartDisplay();
            
            alert('🎉 Payment successful! Order placed! Check Orders tab 📦');
            showOrders();
        }

        // Orders
        function renderOrders() {
            const container = document.getElementById('order-list');
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; font-size: 1.2rem; padding: 2rem;">No orders yet! Place your first order 🚀</p>';
                return;
            }
            
            container.innerHTML = orders.map(order => {
                const statusText = order.status === 'received' ? '✅ Order Received' : 
                                 order.status === 'preparing' ? '🔥 In Kitchen' : '🚚 Out for Delivery';
                const statusClass = order.status;
                
                return `
                    <div class="order-item">
                        <div>
                            <h3>Order #${order.id.toString().slice(-6)}</h3>
                            <p><strong>${order.items.length} Pizzas</strong> | ₹${order.total}</p>
                            <p style="color: #666;">${order.timestamp}</p>
                            <p><strong>Payment ID:</strong> ${order.paymentId?.slice(-8) || 'Cash'}</p>
                        </div>
                        <div style="text-align: right;">
                            <span class="status-badge status-${statusClass}">${statusText}</span>
                            ${isAdmin ? `
                                <div style="margin-top: 1rem;">
                                    <button onclick="updateOrderStatus(${order.id}, 'preparing')" style="background: #ffc107; color: black; border: none; padding: 0.6rem 1rem; border-radius: 20px; cursor: pointer; margin-right: 0.5rem;">Kitchen</button>
                                    <button onclick="updateOrderStatus(${order.id}, 'ready')" style="background: #007bff; color: white; border: none; padding: 0.6rem 1rem; border-radius: 20px; cursor: pointer;">Delivery</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateOrderStatus(orderId, status) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = status;
                saveData();
                renderOrders();
            }
        }

        // Data Storage
        function saveData() {
            localStorage.setItem('hotpizza', JSON.stringify({ cart, orders, currentUser, isAdmin }));
        }

        function loadData() {
            const data = localStorage.getItem('hotpizza');
            if (data) {
                const parsed = JSON.parse(data);
                cart = parsed.cart || [];
                orders = parsed.orders || [];
                currentUser = parsed.currentUser || null;
                isAdmin = parsed.isAdmin || false;
            }
            updateCartCount();
        }
    </script>
</body>
</html>
